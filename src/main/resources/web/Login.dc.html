<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AGbyte · Iniciar sesión</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<link rel="stylesheet" href="./codyu-theme.css">
<script src="./codyu-store.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--bg)}
a{color:var(--g-text)}a:hover{color:var(--g-hover)}
.cy-btn{transition:background-color .15s ease}
.cy-btn:hover{background-color:#5E1229!important}
.cy-sec{transition:background-color .15s ease,border-color .15s ease}
.cy-sec:hover{background-color:var(--g50)!important;border-color:var(--g300)!important}
.cy-input:focus{border-color:#9B2242!important;box-shadow:0 0 0 4px var(--g100);outline:none}
:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-wrap: wrap; background: var(--bg); font-family: 'Nunito', system-ui, sans-serif; color: var(--ink);">

  <section style="flex: 1 1 520px; min-width: 0; box-sizing: border-box; padding: 28px 32px 40px; display: flex; flex-direction: column;">
    <a href="Main.dc.html" aria-label="AGbyte, volver a la bienvenida" style="display: flex; align-items: center; gap: 10px; text-decoration: none; align-self: flex-start;">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #B02A50; box-shadow: 0 3px 0 #9B2242; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5"></path><path d="m16 7 5 5-5 5"></path><path d="m14 4-4 16"></path></svg>
      </span>
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.02em; color: var(--ink);">AG<span style="color: var(--g-num);">byte</span></span>
    </a>

    <div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 32px 0;">
      <form aria-labelledby="login-title" style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h1 id="login-title" style="margin: 0; font-size: 34px; line-height: 1.15; font-weight: 900; letter-spacing: -0.02em;">Qué bueno verte de nuevo</h1>
          <p style="margin: 0; font-size: 16px; font-weight: 600; color: var(--ink-3);">Inicia sesión para seguir con tu racha.</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="login-email" style="font-size: 13px; font-weight: 800; color: var(--ink);">Correo electrónico</label>
          <input id="login-email" class="cy-input" type="email" autocomplete="email" placeholder="tu@correo.com" value="{{email}}" onChange="{{onEmail}}" onKeyDown="{{onKey}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line-strong); background: var(--card); font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink);">
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label for="login-pass" style="font-size: 13px; font-weight: 800; color: var(--ink);">Contraseña</label>
            <a href="#" style="font-size: 13px; font-weight: 800; text-decoration: none;">¿La olvidaste?</a>
          </div>
          <div style="position: relative;">
            <input id="login-pass" class="cy-input" type="{{pwType}}" autocomplete="current-password" placeholder="Tu contraseña" value="{{pw}}" onChange="{{onPw}}" onKeyDown="{{onKey}}" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 52px 0 14px; border-radius: 12px; border: 2px solid var(--line-strong); background: var(--card); font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink);">
            <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" aria-pressed="{{pwShown}}" style="position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center;">
              <sc-if value="{{pwHidden}}" hint-placeholder-val="{{ true }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </sc-if>
              <sc-if value="{{pwShown}}" hint-placeholder-val="{{ false }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.2A10 10 0 0 1 12 4c7 0 10 8 10 8a17 17 0 0 1-3.2 4.2"></path><path d="M6.6 6.6C3.6 8.6 2 12 2 12s3 8 10 8a9.7 9.7 0 0 0 5.4-1.6"></path><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"></path><path d="m2 2 20 20"></path></svg>
              </sc-if>
            </button>
          </div>
        </div>

        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--ink-3); cursor: pointer;">
          <input type="checkbox" style="width: 18px; height: 18px; accent-color: #7A1A35; margin: 0;">
          Mantener la sesión iniciada
        </label>

        <sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
          <p role="alert" style="margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--r50); border: 1px solid var(--r200); font-size: 14px; font-weight: 800; color: var(--r-text);">{{error}}</p>
        </sc-if>
        <button type="button" class="cy-btn" onClick="{{submit}}" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #7A1A35; box-shadow: 0 4px 0 #4A0E22; color: #FFFFFF; font-size: 16px; font-weight: 900; text-decoration: none; border: 0; font-family: inherit; cursor: pointer;">Iniciar sesión</button>

        <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 800; color: var(--ink-4b);">
          <span style="flex: 1; height: 1px; background: var(--line-3);"></span>
          o
          <span style="flex: 1; height: 1px; background: var(--line-3);"></span>
        </div>

        <dc-import name="GoogleConnect" mode="login" label="Continuar con Google" hint-size="100%,52px"></dc-import>

        <p style="margin: 6px 0 0; text-align: center; font-size: 14px; font-weight: 700; color: var(--ink-3);">¿Nuevo en AGbyte? <a href="Registro.dc.html" style="font-weight: 900; text-decoration: none;">Crea una cuenta gratis</a></p>
      </form>
    </div>
  </section>

  <aside aria-label="Tu progreso te espera" style="flex: 1 1 440px; min-width: 0; box-sizing: border-box; margin: 16px; border-radius: 32px; background: linear-gradient(150deg, #7A1A35 0%, #9B2242 55%, #B02A50 100%); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 48px 32px; min-height: 560px;">
    <div style="position: absolute; width: 360px; height: 360px; border-radius: 50%; right: -120px; top: -120px; background: rgba(255,255,255,0.10);"></div>
    <div style="position: absolute; width: 240px; height: 240px; border-radius: 50%; left: -80px; bottom: -90px; background: rgba(255,255,255,0.08);"></div>

    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 24px; max-width: 380px;">
      <div style="position: relative; background: var(--card); border-radius: 20px; padding: 16px 20px; box-shadow: 0 16px 36px rgba(0,0,0,0.16); font-size: 17px; line-height: 1.45; font-weight: 800; color: var(--ink); text-align: center;">
        Tu racha y tu progreso te esperan. ¡Sigamos aprendiendo!
        <span style="position: absolute; left: 50%; bottom: -8px; width: 16px; height: 16px; background: var(--card); transform: translateX(-50%) rotate(45deg);"></span>
      </div>
      <dc-import name="Cody" size="190" mood="feliz" hint-size="190px,190px"></dc-import>
      <div style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.28); color: #FFFFFF;">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: var(--card); color: var(--g-text); display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <strong style="font-size: 15px; font-weight: 900;">7 cursos para elegir</strong>
          <span style="font-size: 13px; font-weight: 700;">Python, Java, JavaScript, HTML, CSS, SQL y C++</span>
        </span>
      </div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { shown: false, email: '', pw: '', error: '' };
  }
  submit() {
    const email = (this.state.email || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { this.setState({ error: 'Escribe un correo válido, por ejemplo tu@correo.com.' }); return; }
    if ((this.state.pw || '').length < 1) { this.setState({ error: 'Escribe tu contraseña.' }); return; }
    const S = window.CodyuStore;
    if (S) { const a = S.login(email); window.location.href = a.onboarded ? 'Inicio.dc.html' : 'Onboarding.dc.html'; }
  }
  renderVals() {
    const shown = this.state.shown;
    return {
      pwType: shown ? 'text' : 'password',
      pwShown: shown,
      pwHidden: !shown,
      pwLabel: shown ? 'Ocultar contraseña' : 'Mostrar contraseña',
      togglePw: () => this.setState({ shown: !shown }),
      email: this.state.email,
      pw: this.state.pw,
      error: this.state.error,
      hasError: !!this.state.error,
      onEmail: (e) => this.setState({ email: e.target.value, error: '' }),
      onPw: (e) => this.setState({ pw: e.target.value, error: '' }),
      onKey: (e) => { if (e.key === 'Enter') this.submit(); },
      submit: () => this.submit()
    };
  }
}
</script>
</body>
</html>
