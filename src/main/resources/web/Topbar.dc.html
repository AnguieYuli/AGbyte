<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Barra superior de AGbyte</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<link rel="stylesheet" href="./codyu-theme.css">
<script src="./codyu-store.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="box-sizing: border-box; width: 100%; min-height: 72px; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; font-family: 'Nunito', system-ui, sans-serif; {{c.root}}">
  <div style="display: flex; flex-direction: column; gap: 1px;">
    <span style="font-size: 21px; line-height: 1.2; font-weight: 900; letter-spacing: -0.01em; {{c.title}}">Hola, {{first}}</span>
    <span style="font-size: 13px; font-weight: 700; {{c.muted}}">{{dateLabel}}</span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
    <a href="Logros.dc.html" aria-label="Racha de {{rachaLabel}}" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 900; text-decoration: none; box-sizing: border-box; {{c.streak}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#F97316" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
      {{rachaLabel}}
    </a>
    <a href="Logros.dc.html" aria-label="{{xp}} puntos de experiencia" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 900; text-decoration: none; box-sizing: border-box; {{c.xp}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#B02A50" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
      {{xp}} XP
    </a>
    <a href="Notificaciones.dc.html" aria-label="{{bellLabel}}" aria-current="{{bellCurrent}}" style="position: relative; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; {{c.bell}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; top: 5px; right: 5px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: #D92D20; color: #FFFFFF; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; {{c.badgeRing}}">{{unread}}</span></sc-if>
    </a>
    <a href="Perfil.dc.html" aria-label="Tu perfil: {{name}}" style="width: 44px; height: 44px; border-radius: 12px; background: #7A1A35; box-shadow: 0 3px 0 #4A0E22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; text-decoration: none; overflow: hidden;"><sc-if value="{{hasPhoto}}" hint-placeholder-val="{{ false }}"><span style="display: block; width: 100%; height: 100%; background: center / cover no-repeat url('{{photo}}');"></span></sc-if><sc-if value="{{noPhoto}}" hint-placeholder-val="{{ true }}">{{initial}}</sc-if></a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"bell":{"editor":"enum","options":["normal","activo"],"default":"normal"},"xp":{"editor":"text","default":"280"},"racha":{"editor":"text","default":"5"},"$preview":{"width":1192,"height":72}}'>
class Component extends DCLogic {
  componentDidMount() { this._h = () => this.forceUpdate(); window.addEventListener('codyu:change', this._h); }
  componentWillUnmount() { window.removeEventListener('codyu:change', this._h); }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const bellOn = (this.props.bell ?? 'normal') === 'activo';
    const t = dark
      ? { root: 'background: #191215; border-bottom: 1px solid #30252A;', title: 'color: #F4EBEF;', muted: 'color: #B09FA7;',
          streak: 'background: #2A1A0E; border: 1px solid #7C2D12; color: #FDBA74;',
          xp: 'background: #0F2A1A; border: 1px solid #5E1229; color: #F0A9BD;',
          bell: bellOn ? 'background: #3E1A26; color: #F0A9BD; border: 1px solid #582337;' : 'background: #251B20; color: #C4B5BC; border: 1px solid #30252A;',
          badgeRing: 'box-shadow: 0 0 0 2px #191215;' }
      : { root: 'background: var(--card); border-bottom: 1px solid var(--line);', title: 'color: var(--ink);', muted: 'color: var(--ink-4);',
          streak: 'background: var(--o50); border: 1px solid var(--o200); color: var(--o-text);',
          xp: 'background: var(--g50); border: 1px solid var(--g200); color: var(--g-text);',
          bell: bellOn ? 'background: var(--g100); color: var(--g-ink); border: 1px solid var(--g200);' : 'background: var(--bg); color: var(--ink-2); border: 1px solid var(--line);',
          badgeRing: 'box-shadow: 0 0 0 2px var(--card);' };
    const S = window.CodyuStore;
    const me = S ? S.me() : { first: 'Alex', name: 'Alex García', initial: 'A' };
    const st = S ? S.stats() : { xp: 280, streak: 5 };
    const unread = S ? S.unreadCount() : 2;
    return {
      c: t, bellCurrent: bellOn ? 'page' : undefined,
      xp: S ? String(st.xp) : (this.props.xp ?? '280'),
      racha: S ? String(st.streak) : (this.props.racha ?? '5'),
      rachaLabel: (S ? st.streak : (this.props.racha ?? '5')) + ((S ? st.streak : 5) == 1 ? ' día' : ' días'),
      first: me.first, name: me.name, initial: me.initial, photo: me.avatar || '', hasPhoto: !!me.avatar, noPhoto: !me.avatar,
      dateLabel: S ? S.fmtLong(S.today()) : 'Lunes, 19 de octubre de 2026',
      unread: unread, hasUnread: unread > 0,
      bellLabel: unread > 0 ? 'Notificaciones, ' + unread + ' sin leer' : 'Notificaciones'
    };
  }
}
</script>
</body>
</html>
