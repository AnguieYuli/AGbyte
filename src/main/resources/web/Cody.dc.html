<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":160,"min":24,"max":400,"unit":"px"},"mood":{"editor":"enum","options":["feliz","celebra","saluda","piensa","triste"],"default":"feliz"},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 160) || 160;
    const mood = this.props.mood ?? 'feliz';
    return {
      px: size + 'px',
      isFeliz: mood === 'feliz',
      isCelebra: mood === 'celebra',
      isSaluda: mood === 'saluda',
      isPiensa: mood === 'piensa',
      isTriste: mood === 'triste'
    };
  }
}
</script>
