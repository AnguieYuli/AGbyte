<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","ruta","lecciones","ejercicios","editor","ranking","logros","perfil","ajustes","cody","ninguno"],"default":"inicio"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'inicio';
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { root: '#191215', logo: '#F4EBEF', label: '#A18F98', idle: '#C4B5BC', onBg: '#3E1A26', onFg: '#F0A9BD', cardBg: '#3E1A26', cardBorder: '#582337', cardTitle: '#F7CCD8', cardSub: '#BBA9B1', cardOnBorder: '#E07A97' }
      : { root: 'var(--card)', logo: 'var(--ink)', label: 'var(--ink-4)', idle: 'var(--ink-2)', onBg: 'var(--g100)', onFg: 'var(--g-ink)', cardBg: 'var(--g50)', cardBorder: 'var(--g200)', cardTitle: 'var(--g-ink)', cardSub: 'var(--ink-2)', cardOnBorder: '#B02A50' };
    const keys = ['inicio', 'ruta', 'lecciones', 'ejercicios', 'editor', 'ranking', 'logros', 'perfil', 'ajustes', 'cody'];
    const s = {}, on = {}, cur = {};
    keys.forEach((k) => {
      const isOn = k === active;
      s[k] = isOn ? 'color: ' + t.onFg + '; background: ' + t.onBg + ';' : 'color: ' + t.idle + ';';
      on[k] = isOn;
      cur[k] = isOn ? 'page' : undefined;
    });
    return {
      s, on, cur,
      c: {
        root: 'background: ' + t.root + ';',
        logo: 'color: ' + t.logo + ';',
        label: 'color: ' + t.label + ';',
        card: 'background: ' + t.cardBg + '; border: 2px solid ' + (active === 'cody' ? t.cardOnBorder : t.cardBorder) + ';',
        cardTitle: 'color: ' + t.cardTitle + ';',
        cardSub: 'color: ' + t.cardSub + ';'
      }
    };
  }
}
</script>
